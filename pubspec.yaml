name: taskforge_mobile
description: TaskForge for Android and iOS. Multi-tenant project management on the go.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2
  intl: ^0.20.1
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.16
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1B1A17"
  adaptive_icon_foreground: assets/images/icon_foreground.png

flutter_native_splash:
  color: "#0d0f10"
  image: assets/images/splash.png
  android_12:
    color: "#0d0f10"
    image: assets/images/splash_android12.png
